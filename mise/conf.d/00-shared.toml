[tools]
node = "24.21.0"
oxlint = "1.84.0"
markdownlint-cli2 = "0.23.3"
actionlint = "1.7.12"
zizmor = "1.30.1"

[tasks.install]
description = "Install npm dependencies from the lockfile"
run = "npm ci --ignore-scripts --no-audit --no-fund"

[tasks."lint:js"]
description = "Lint with oxlint, warnings denied"
run = "oxlint --deny-warnings --report-unused-disable-directives"

[tasks."lint:md"]
description = "Lint markdown"
run = "markdownlint-cli2"

[tasks."lint:actions"]
description = "Lint the workflows and audit them for supply-chain issues"
run = ["actionlint", "zizmor --offline --min-severity medium .github/workflows"]
