name: Publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: npm install --global npm@^11.15.0
      - run: mise run install
      - run: mise run check
      - name: Dry run until trusted publishing is ready
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: npm publish --dry-run
      - name: Publish to npm
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: npm publish --access public
