name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: mise run install
      - run: mise run check
      - name: Pack without publishing while npm bootstrap is incomplete
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: npm publish --dry-run
      - name: Publish to npm with provenance
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: npm publish --provenance --access public
